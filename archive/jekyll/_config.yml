# Site Author
author:
  name             : "魏佳桐"
  avatar           :
  bio              : "西北工业大学"
  location         : "西安"
  employer         : "西北工业大学"
  pubmed           :
  googlescholar    :
  email            : "joyetong58@gmail.com"
  researchgate     :
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
