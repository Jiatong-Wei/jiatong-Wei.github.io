  <style>
    :root {
      --bg: #0a0d0b;
      --fg: #c9d6c9;
      --accent: #6bff8f;
      --dim: #5c6b5c;
      --bar: #0d110e;
      --line: #1c2620;
    }
    :root[data-theme='light'] {
      --bg: #f7f6f2;
      --fg: #20241f;
      --accent: #0a8f33;
      --dim: #6b706b;
      --bar: #efede7;
      --line: #d9d7cf;
      --pet-ear: #6b4a2b;
      --pet-head: #c09055;
      --pet-eye: #241505;
      --pet-eyeH: #ff6b6b;
      --pet-muzzle: #ecd9b0;
      --pet-nose: #241505;
    }
    :root {
      --pet-ear: #7a5230;
      --pet-head: #c9964f;
      --pet-eye: #2a1a0e;
      --pet-eyeH: #c93a30;
      --pet-muzzle: #f2e7cb;
      --pet-nose: #2a1a0e;
      --pet-cube: #c93a30;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, "Sarasa Mono SC",
        "Noto Sans Mono CJK SC", "Source Han Mono SC", "Microsoft YaHei Mono", monospace;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100dvh; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; height: 42px; flex: none;
      background: var(--bar); border-bottom: 1px solid var(--line);
      font-size: 13px; color: var(--dim); user-select: none;
    }
    header .status { display: inline-flex; align-items: center; gap: 8px; }
    .dot {
      color: var(--accent); font-size: 11px; line-height: 1;
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; text-shadow: 0 0 4px currentColor; transform: scale(1); }
      50% { opacity: 0.45; text-shadow: 0 0 10px currentColor; transform: scale(0.82); }
    }
    header .right { display: inline-flex; align-items: center; gap: 14px; }
    header .right a, header .right button,
    header .right a svg, header .right button svg {
      color: var(--dim); text-decoration: none; background: none; border: none;
      font: inherit; cursor: pointer; padding: 0;
    }
    header .right a:hover, header .right button:hover { color: var(--accent); }
    header .right a, header .right button { display: inline-flex; align-items: center; }

    /* theme icons: the active-mode icon glows in its own light —
       moon = bright yellow moonlight, sun = warm orange sunlight */
    #theme-btn { gap: 8px; }
    #theme-btn .ico-moon, #theme-btn .ico-sun {
      transition: opacity .3s, filter .3s;
      opacity: .35;
    }
    :root .ico-moon {
      opacity: 1 !important;
      filter: drop-shadow(0 0 5px #f5e27a) drop-shadow(0 0 9px #f5e27a);
    }
    :root[data-theme='light'] #theme-btn .ico-moon { opacity: .35; filter: none; }
    :root #theme-btn .ico-sun { opacity: .35; filter: none; }
    :root[data-theme='light'] #theme-btn .ico-sun {
      opacity: 1 !important;
      filter: drop-shadow(0 0 5px #f0a232) drop-shadow(0 0 9px #f0a232);
    }
    #term-wrap { flex: 1; min-height: 0; padding: 8px 10px 12px; }
    #term, #term .xterm { height: 100%; }
    #overlay {
      position: fixed; inset: 0; z-index: 50; display: none;
      background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(2px);
      align-items: center; justify-content: center; padding: 24px;
    }
    #overlay.show { display: flex; }
    #overlay img { max-width: 92vw; max-height: 86vh; border: 1px solid var(--line); }
    #overlay iframe { width: 92vw; height: 86vh; border: 1px solid var(--line); background: var(--bg); }
    #overlay .cap {
      position: absolute; bottom: 18px; left: 0; right: 0; text-align: center;
      color: var(--dim); font-size: 13px;
    }
    #overlay .close {
      position: absolute; top: 14px; right: 18px; font-size: 22px; cursor: pointer;
      color: var(--dim); background: none; border: none;
    }
    #overlay .close:hover { color: var(--accent); }
    #pet {
      position: fixed; bottom: 6px; right: 18px; z-index: 40;
      cursor: grab; user-select: none; touch-action: none;
      transition: left 1s ease-in-out, top 1s ease-in-out, transform .3s ease;
      /* never intercept clicks aimed at terminal content under her */
      pointer-events: auto;
    }
    /* small screens: limited real estate — UMI stays hidden unless summoned
       with `pet on` (choice persists in localStorage) */
    @media (max-width: 768px) {
      #pet { display: none; }
      #pet.umi-on { display: block; }
    }
    #pet.sit { transform: rotate(-8deg); }
    #pet.walk pre { animation: pet-bob .45s ease-in-out infinite; }
    @keyframes pet-bob { 50% { transform: translateY(2px); } }
    #pet:active { cursor: grabbing; }
    #pet.dragging { transition: none; }
    #pet pre {
      margin: 0; font-family: inherit; font-size: 12px; line-height: 1.2;
      color: var(--fg);
    }
    #pet .pc-ear  { color: var(--pet-ear); }
    #pet .pc-gap  { color: transparent; }
    #pet .pc-head { color: var(--pet-head); }
    #pet .pc-eye  { color: var(--pet-eye); }
    #pet .pc-eyeH { color: var(--pet-eyeH); }
    #pet .pc-muzzle { color: var(--pet-muzzle); }
    #pet .pc-nose { color: var(--pet-nose); }
    #pet .pc-cube { color: var(--pet-cube); }
    #pet .pet-bubble {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      margin-bottom: 4px; white-space: nowrap;
      background: var(--bar); border: 1px solid var(--line); border-radius: 6px;
      padding: 2px 7px; font-size: 11px; color: var(--fg);
      opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    #pet .pet-bubble.show { opacity: 1; }
    #pet.hop { animation: pet-hop .45s ease; }
    @keyframes pet-hop {
      30% { transform: translateY(-7px); }
      60% { transform: translateY(0); }
      80% { transform: translateY(-3px); }
    }
    #pet.spin pre { animation: pet-spin .9s ease; transform-origin: 50% 60%; }
    @keyframes pet-spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      header { font-size: 12px; }
      #term-wrap { padding: 4px 2px 8px; }
    }
    noscript div { max-width: 640px; margin: 12vh auto; padding: 0 20px; line-height: 1.8; font-size: 14px; }
    noscript a { color: var(--accent); }
  </style>
